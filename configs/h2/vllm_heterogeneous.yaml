name: "vllm_b16_heterogeneous"
model: "meta-llama/Llama-3.2-1B"
backend: "vllm"
block_size: 16
dtype: "float16"
seed: 42

workload:
  num_sequences: 1000
  prompt_length:
    distribution: "uniform"
    min: 32
    max: 512
  output_tokens:
    distribution: "uniform"
    min: 64
    max: 256

stats:
  nvml_poll_interval: 0.1
