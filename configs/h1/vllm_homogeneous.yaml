name: "vllm_b16_homogeneous"
model: "meta-llama/Llama-3.2-1B"
backend: "vllm"
block_size: 16
dtype: "float16"
seed: 42

workload:
  num_sequences: 1000
  prompt_length:
    distribution: "fixed"
    value: 256
  output_tokens:
    distribution: "fixed"
    value: 128

stats:
  nvml_poll_interval: 0.1
  vllm_metrics_poll_interval: 0.1
