name: "h3_vllm_b16_long"
model: "meta-llama/Llama-3.2-1B"
backend: "vllm"
# ALLOWED BLOCK SIZES: 8, 16, 32
block_size: 16
dtype: "float16"
seed: 42
enforce_eager: true
use_torch: true

workload:
  num_sequences: 30
  prompt_length:
    distribution: "fixed"
    value: 64
  output_tokens:
    distribution: "fixed"
    value: 1024

stats:
  nvml_poll_interval: 0.1
  vllm_metrics_poll_interval: 0.1
